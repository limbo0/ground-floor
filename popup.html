<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ground Floor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Mono:wght@300;400&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 480px;
      background: #faf8f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2a2720;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid #ede9e2;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-mark {
      width: 34px;
      height: 34px;
      background: #eeece8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-name {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: #9a9288;
      text-transform: uppercase;
    }
    .open-full, button.open-full {
      font-size: 11px;
      color: #b0aa9e;
      text-decoration: none;
      border: 1px solid #ddd9d2;
      padding: 4px 9px;
      border-radius: 20px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .open-full:hover {
      color: #5a5248;
      border-color: #bbb5aa;
      background: #f0ede8;
    }

    /* This week summary */
    .week-summary {
      padding: 16px 20px 12px;
      border-bottom: 1px solid #ede9e2;
    }
    .week-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: #b0aa9e;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .week-stats {
      display: flex;
      gap: 0;
    }
    .stat-block {
      flex: 1;
      text-align: center;
      padding: 0 6px;
      border-right: 1px solid #ede9e2;
    }
    .stat-block:last-child { border-right: none; }
    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: #2a2720;
      line-height: 1;
      margin-bottom: 3px;
    }
    .stat-desc {
      font-size: 10px;
      color: #a09a90;
      line-height: 1.3;
    }

    /* Insight card */
    .insight {
      margin: 12px 16px;
      background: #f2efe9;
      border-radius: 10px;
      padding: 12px 14px;
      border-left: 3px solid #c8b99a;
    }
    .insight-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: #a09a90;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .insight-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 13.5px;
      color: #3a3530;
      line-height: 1.5;
    }

    /* Top emotions */
    .section {
      padding: 12px 20px;
      border-bottom: 1px solid #ede9e2;
    }
    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: #b0aa9e;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .emotion-bars {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .emotion-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .emotion-name {
      font-size: 12px;
      color: #5a5248;
      width: 90px;
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 5px;
      background: #e8e4dc;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      background: #8b7d6b;
      transition: width 0.8s ease;
    }
    .emotion-count {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: #b0aa9e;
      width: 18px;
      text-align: right;
    }

    /* Recent entries */
    .recent-entries {
      padding: 12px 20px 16px;
    }
    .entry-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #f0ece5;
    }
    .entry-row:last-child { border-bottom: none; }
    .entry-emotion {
      font-size: 13px;
      color: #3a3530;
    }
    .entry-time {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: #b8b2a8;
    }

    /* Empty state */
    .empty-state {
      padding: 40px 24px;
      text-align: center;
    }
    .empty-wave {
      margin-bottom: 16px;
      opacity: 0.4;
    }
    .empty-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      color: #3a3530;
      margin-bottom: 8px;
    }
    .empty-sub {
      font-size: 12px;
      color: #b0aa9e;
      line-height: 1.6;
    }

    /* Footer */
    .popup-footer {
      padding: 10px 20px;
      border-top: 1px solid #ede9e2;
      display: flex;
      justify-content: center;
    }
    .footer-link, button.footer-link {
      font-size: 11px;
      color: #b0aa9e;
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-link:hover { color: #5a5248; }

    /* Loading */
    button.open-full, button.footer-link {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    .loading {
      padding: 40px 20px;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #c0b9b0;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">loading...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
